<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ШІ-огляд практики ВРП — дисциплінарні палати</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; }

    :root {
      --blue:    #1a56db;
      --blue-lt: #e8f0fe;
      --navy:    #0f2557;
      --gold:    #d4a017;
      --bg:      #f4f6fb;
      --surface: #ffffff;
      --border:  #dce3f0;
      --text:    #1e2a45;
      --muted:   #6b7a99;
      --green:   #1d8a4e;
      --red:     #c0392b;
      --radius:  10px;
      --shadow:  0 2px 12px rgba(15,37,87,.08);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
      color: #fff;
      padding: 1.8rem 1.5rem 1.6rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(15,37,87,.25);
    }
    .header-badge {
      display: inline-flex; align-items: center; gap: .4rem;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
      border-radius: 20px; padding: .25rem .85rem; font-size: .72rem;
      letter-spacing: .05em; text-transform: uppercase; margin-bottom: .8rem;
    }
    h1 {
      font-size: clamp(1.25rem, 3vw, 1.8rem); font-weight: 700;
      line-height: 1.25; max-width: 720px; margin: 0 auto .4rem;
    }

    /* ── Layout ── */
    .wrap { max-width: 1280px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    .layout { display: grid; grid-template-columns: 260px 1fr; gap: 1.25rem; }

    /* ── Filters sidebar ── */
    .filters {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 1rem; align-self: start; position: sticky; top: 1rem;
      max-height: calc(100vh - 2rem); overflow-y: auto;
    }
    .filters h2 {
      font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); margin-bottom: .75rem;
    }
    /* Mobile-only collapse toggle (hidden on desktop) */
    .filters-toggle { display: none; }
    .search-wrap { position: relative; margin-bottom: 1rem; }
    .search-wrap svg {
      position: absolute; left: .7rem; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
    }
    #searchInput {
      width: 100%; padding: .55rem .8rem .55rem 2.1rem;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      font-size: .88rem; background: var(--surface); color: var(--text); outline: none;
    }
    #searchInput:focus { border-color: var(--blue); }

    .facet { margin-bottom: 1rem; }
    .facet-title { font-size: .82rem; font-weight: 600; margin-bottom: .4rem; }
    .facet select {
      width: 100%; padding: .45rem .6rem; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: .85rem; background: var(--surface);
      color: var(--text); outline: none;
    }
    .facet select:focus { border-color: var(--blue); }
    .reset-btn {
      width: 100%; padding: .5rem; margin-top: .25rem; border: 1px solid var(--border);
      border-radius: 8px; background: var(--bg); color: var(--muted);
      font-size: .82rem; cursor: pointer;
    }
    .reset-btn:hover { background: var(--blue-lt); color: var(--blue); }

    /* ── Results ── */
    .results-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: .75rem; flex-wrap: wrap; gap: .5rem;
    }
    .count-badge { font-size: .85rem; color: var(--muted); }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      margin-bottom: 1rem; overflow: hidden;
    }
    .card-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 1rem; padding: 1rem 1.1rem; cursor: pointer; background: var(--surface);
    }
    /* Let the text column shrink instead of being forced wide by long tags (flexbox min-width:auto trap) */
    .card-head > div { min-width: 0; }
    .card-head:hover { background: var(--blue-lt); }
    .card-title { font-size: 1.02rem; font-weight: 700; color: var(--navy); text-wrap: balance; }
    /* Multiplicity should read at a glance, not require counting the names. */
    .judge-count {
      display: inline-block; margin-left: .45rem; vertical-align: .1em;
      font-size: .7rem; font-weight: 700; letter-spacing: .02em;
      padding: .1rem .45rem; border-radius: 10px;
      background: var(--blue-lt); color: var(--blue);
    }
    .card-subtitle { font-size: .9rem; font-weight: 600; color: #3a4a6b; margin-top: .15rem; }
    .card-meta { font-size: .82rem; color: var(--muted); margin-top: .2rem; }
    .stage-note { font-size: .8rem; color: var(--muted); margin-top: .3rem; font-style: italic; }
    .card-essence { font-size: .88rem; color: #3a4a6b; margin-top: .5rem; line-height: 1.5; }
    .chev { color: var(--muted); flex-shrink: 0; transition: transform .15s; }
    .card.open .chev { transform: rotate(180deg); }

    .tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .6rem; }
    .tag {
      font-size: .72rem; padding: .15rem .55rem; border-radius: 12px;
      background: var(--blue-lt); color: var(--blue); font-weight: 600;
      max-width: 100%; overflow-wrap: anywhere;
    }
    .tag.sanction { background: #fdeeee; color: var(--red); }
    .tag.stage    { background: #eaf6ef; color: var(--green); }

    /* ── Card body (expanded) ── */
    .card-body { display: none; padding: 0 1.1rem 1.1rem; border-top: 1px solid var(--border); }
    .card.open .card-body { display: block; }

    .field { margin-top: 1rem; }
    .field-label {
      font-size: .74rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); font-weight: 700; margin-bottom: .3rem;
    }
    .field-val { font-size: .9rem; line-height: 1.55; color: var(--text); }
    .field-val ul { padding-left: 1.1rem; }
    .field-val li { margin-bottom: .25rem; }

    .stages { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .6rem; margin-top: .3rem; }
    .stage-col {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: .55rem .65rem;
    }
    .stage-name {
      font-size: .72rem; font-weight: 700; color: var(--navy);
      text-transform: uppercase; letter-spacing: .03em; margin-bottom: .25rem;
    }
    .stage-val { font-size: .84rem; line-height: 1.45; color: #3a4a6b; }
    .stage-val.empty { color: var(--muted); font-style: italic; }

    /* ── Related acts (ухвала / ВРП перегляд) ──
       Tinted and rule-marked so a reader can see at a glance which text is this
       act's and which was carried in from another act in the same case. */
    .related {
      margin-top: 1rem; padding: .75rem .85rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
    }
    .related-ruling { border-left: 3px solid var(--gold); }
    .related-review { border-left: 3px solid var(--green); }
    .related-head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: .6rem; flex-wrap: wrap;
    }
    .related-label {
      font-size: .74rem; text-transform: uppercase; letter-spacing: .05em;
      font-weight: 700; color: var(--navy);
    }
    .related-meta { font-size: .8rem; color: var(--muted); }
    .related-meta a { color: var(--blue); font-weight: 600; text-decoration: none; }
    .related-meta a:hover { text-decoration: underline; }
    .related .field:first-of-type { margin-top: .7rem; }
    .related .stage-col { background: var(--surface); }

    .src-link {
      display: inline-flex; align-items: center; gap: .35rem; margin-top: .9rem;
      font-size: .85rem; color: var(--blue); font-weight: 600; text-decoration: none;
    }
    .src-link:hover { text-decoration: underline; }
    .src-link.disabled { color: var(--muted); pointer-events: none; font-weight: 500; }

    .loading, .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .spinner {
      display: inline-block; width: 26px; height: 26px; border: 3px solid var(--border);
      border-top-color: var(--blue); border-radius: 50%;
      animation: spin .7s linear infinite; margin-bottom: .75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { text-align: center; padding: 1.25rem 1rem 2rem; font-size: .78rem; color: var(--muted); }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .filters {
        position: static; max-height: none; overflow: visible;
        padding: .35rem; margin-bottom: .25rem;
      }
      .filters h2 { display: none; }            /* label lives in the toggle on mobile */
      .filters-toggle {
        display: flex; align-items: center; justify-content: space-between;
        width: 100%; padding: .7rem .85rem; border: none; background: none;
        font-size: .9rem; font-weight: 700; color: var(--navy);
        text-transform: uppercase; letter-spacing: .04em; cursor: pointer;
      }
      .filters-toggle .chev { transition: transform .2s; }
      .filters.open .filters-toggle .chev { transform: rotate(180deg); }
      /* Collapsed by default on mobile so results are visible immediately */
      .filters-body { display: none; padding: 0 .5rem .5rem; }
      .filters.open .filters-body { display: block; }
      /* Pack the facets two-up to cut the panel's height when expanded */
      .filters-body .facet { margin-bottom: .7rem; }
      .stages { grid-template-columns: 1fr; }
    }
    @media (max-width: 860px) and (min-width: 460px) {
      .facets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
      .facets-grid .facet { margin-bottom: 0; }
    }
  </style>
</head>
<body>

<header>
  <span class="header-badge">ВРП | BRDO</span>
  <h1>ШІ-огляд практики дисциплінарних палат<br>Вищої ради правосуддя</h1>
</header>

<div class="wrap">
  <div class="layout">

    <!-- Filters -->
    <aside class="filters">
      <button class="filters-toggle" id="filtersToggle" aria-expanded="false" aria-controls="filtersBody">
        <span>Пошук і фільтри</span>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="filters-body" id="filtersBody">
      <h2>Пошук і фільтри</h2>
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="searchInput" placeholder="Пошук за прямими збігами…" />
      </div>

      <div class="facets-grid">
      <div class="facet">
        <div class="facet-title">Суддя</div>
        <select id="filterJudge"><option value="">Усі судді</option></select>
      </div>
      <div class="facet">
        <div class="facet-title">Суд</div>
        <select id="filterCourt"><option value="">Усі суди</option></select>
      </div>
      <div class="facet">
        <div class="facet-title">Підстава за ст. 106</div>
        <select id="filterGround"><option value="">Усі підстави</option></select>
      </div>
      <div class="facet">
        <div class="facet-title">Стягнення</div>
        <select id="filterSanction"><option value="">Усі стягнення</option></select>
      </div>
      <div class="facet">
        <div class="facet-title">Палата</div>
        <select id="filterChamber"><option value="">Усі палати</option></select>
      </div>
      </div>
      <button class="reset-btn" id="resetBtn">Скинути фільтри</button>
      </div>
    </aside>

    <!-- Results -->
    <main>
      <div class="results-head">
        <span class="count-badge" id="countBadge"></span>
      </div>
      <div id="results">
        <div class="loading"><div class="spinner"></div><br>Завантаження даних…</div>
      </div>
    </main>

  </div>
</div>

<footer>Вища рада правосуддя — BRDO, 2026</footer>

<script>
  let ALL = [];

  const $ = id => document.getElementById(id);
  const esc = s => (s == null ? '' : String(s))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const SANCTION_KINDS = [
    ['Звільнення',            /звільн|подання про звільнення/i],
    // \p{L}, not \w: \w is [A-Za-z0-9_] and cannot match the Cyrillic ending of
    // «Сувора», so this pattern silently failed and every сувора догана fell
    // through to the «Догана» bucket below.
    ['Сувора догана',         /сувор\p{L}*\s+доган/iu],
    ['Догана',                /доган/i],
    ['Попередження',          /попередженн/i],
    ['Відмовлено у притягненні', /відмов/i],
  ];

  // Normalized sanction type, extracted per ст. 109, is authoritative when present.
  // The regex over free text remains only for records extracted before that field
  // existed, and mis-buckets in ways the enum cannot — «звільнено ВІД
  // відповідальності» reads as «Звільнення», its opposite.
  const SANCTION_LABELS = {
    'попередження': 'Попередження',
    'догана': 'Догана',
    'сувора догана': 'Сувора догана',
    'подання про звільнення судді з посади': 'Звільнення',
    'подання про тимчасове відсторонення від здійснення правосуддя': 'Тимчасове відсторонення',
    'стягнення не накладено': 'Стягнення не накладено',
  };

  function leadJudge(d) {
    return (d.judges && d.judges[0]) || {};
  }

  // R5: where a ВРП review exists, the sanction in force is the review's. Showing
  // the palate's would present a quashed sanction as standing — the one error in
  // this dataset that could defame a judge.
  function sanctionKind(d) {
    const lead = leadJudge(d);
    const inForce = lead.review && (lead.review.sanction_type || lead.review.sanction);
    if (inForce) return SANCTION_LABELS[lead.review.sanction_type] || lead.review.sanction_type || 'Інше';
    const type = d.sanction_type || lead.sanction_type;
    if (type) return SANCTION_LABELS[type] || type;
    const s = d.sanction != null ? d.sanction : lead.sanction;
    const t = (typeof s === 'string' ? s : (s && (s.vrp || s.dp)) || '').toString();
    for (const [label, re] of SANCTION_KINDS) if (re.test(t)) return label;
    return t.trim() ? 'Інше' : '—';
  }

  // A ВРП review is its own act; until phase 3 links it, `d.review` is absent and
  // every record here is first-instance. The legacy q.vrp / c.vrp checks stay for
  // records extracted under the old schema.
  function hasVrp(d) {
    const q = d.qualification || {}, c = d.conduct || {};
    return !!(d.review || q.vrp || c.vrp);
  }

  const chamberLabel = d => d.chamber ? d.chamber + ' ДП' : '';

  function fillSelect(sel, values) {
    values.sort((a,b)=>a.localeCompare(b,'uk'));
    for (const v of values) {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    }
  }

  // Judges and courts come from every judge the act names, not just the first:
  // a co-defendant is as findable as the judge who happens to head the record.
  const judgesOf = d => (d.judge_names && d.judge_names.length)
    ? d.judge_names : [d.judge_name].filter(Boolean);
  const courtsOf = d => (d.courts && d.courts.length)
    ? d.courts : [d.court].filter(Boolean);

  // 1 суддя · 2-4 судді · 5+ суддів — and 11-14 take the genitive plural
  // despite ending in 1-4, which is why the check is on the last *two* digits.
  function pluralJudges(n) {
    const t = n % 100, o = n % 10;
    if (t >= 11 && t <= 14) return 'суддів';
    if (o === 1) return 'суддя';
    if (o >= 2 && o <= 4) return 'судді';
    return 'суддів';
  }

  function buildFacets() {
    const grounds = new Set(), courts = new Set(), chambers = new Set(),
          sanctions = new Set(), judges = new Set();
    for (const d of ALL) {
      (d.art106_grounds || []).forEach(g => g && grounds.add(g.trim()));
      judgesOf(d).forEach(n => n && judges.add(n.trim()));
      courtsOf(d).forEach(c => c && courts.add(c.trim()));
      if (d.chamber) chambers.add(d.chamber.trim());
      sanctions.add(sanctionKind(d));
    }
    fillSelect($('filterJudge'), [...judges]);
    fillSelect($('filterCourt'), [...courts]);
    fillSelect($('filterGround'), [...grounds]);
    fillSelect($('filterSanction'), [...sanctions]);
    fillSelect($('filterChamber'), [...chambers]);
  }

  // Free-text per-stage block (conduct, sanction).
  function stageBlock(label, obj, keys) {
    const cols = keys.map(([k, name]) => {
      const v = obj && obj[k];
      return `<div class="stage-col">
        <div class="stage-name">${name}</div>
        <div class="stage-val ${v ? '' : 'empty'}">${v ? esc(v) : '—'}</div>
      </div>`;
    }).join('');
    return `<div class="field">
      <div class="field-label">${esc(label)}</div>
      <div class="stages">${cols}</div>
    </div>`;
  }

  // Кваліфікація per stage: each value is {grounds:[…], note} | null.
  function qualBlock(label, obj, keys) {
    const cols = keys.map(([k, name]) => {
      const v = obj && obj[k];
      const grounds = (v && v.grounds) || [];
      const note = v && v.note;
      let inner;
      if (grounds.length || note) {
        const tags = grounds.map(g => `<span class="tag">${esc(g)}</span>`).join('');
        inner = `<div class="tags" style="margin-top:0">${tags}</div>` +
          (note ? `<div class="stage-note">${esc(note)}</div>` : '');
      } else {
        inner = `<div class="stage-val empty">—</div>`;
      }
      return `<div class="stage-col"><div class="stage-name">${name}</div>${inner}</div>`;
    }).join('');
    return `<div class="field">
      <div class="field-label">${esc(label)}</div>
      <div class="stages">${cols}</div>
    </div>`;
  }

  // Стягнення is per judge: one decision can punish one judge and refuse to
  // punish another, so a single act-level value would have to discard one of them.
  function sanctionBlock(judges) {
    const rows = judges.map(j => {
      const type = j.sanction_type ? `<span class="tag sanction">${esc(SANCTION_LABELS[j.sanction_type] || j.sanction_type)}</span>` : '';
      const text = j.sanction ? esc(j.sanction) : '—';
      const who = judges.length > 1 && j.name ? `<div class="stage-name">${esc(j.name)}</div>` : '';
      return `<div class="stage-col">${who}
        <div class="stage-val ${j.sanction ? '' : 'empty'}">${type}${type ? '<br>' : ''}${text}</div>
      </div>`;
    }).join('');
    return `<div class="field">
      <div class="field-label">Стягнення</div>
      <div class="stages">${rows}</div>
    </div>`;
  }

  // ── Related acts ────────────────────────────────────────────────────────
  // The ухвала that opened the case comes first in the body, before the
  // decision's own фабула: it is what the palate was asked to decide, and the
  // decision only makes sense read against it. An ухвала with no decision is
  // never exported, so there is no orphan card to render here.
  function relatedHead(label, act, cls) {
    const num = act.num ? `№ ${esc(act.num)}` : '';
    const meta = [act.date, num].filter(Boolean).join(' · ');
    const link = act.url
      ? ` · <a href="${esc(act.url)}" target="_blank" rel="noopener">↗ джерело</a>` : '';
    const prov = act.other_candidates
      ? `<div class="stage-note">Зв'язок за ${esc(act.matched_on)}; у корпусі є ще ${act.other_candidates} відповідн${act.other_candidates === 1 ? 'а ухвала' : 'их ухвал'} — перевірте</div>`
      : '';
    return `<div class="related-head ${cls}"><span class="related-label">${label}</span>
      <span class="related-meta">${meta}${link}</span></div>${prov}`;
  }

  function rulingBlock(d) {
    const r = d.ruling;
    if (!r) return '';
    const facts = [
      ['Скарга', [r.complaint_number, r.complaint_date].filter(Boolean).join(' від ')],
      ['Скаржник', r.complainant_name || r.complainant_type],
      ['Пропозиція інспектора', r.inspector_proposal],
    ].filter(([, v]) => v).map(([k, v]) =>
      `<div class="stage-col"><div class="stage-name">${k}</div>
       <div class="stage-val">${esc(v)}</div></div>`).join('');

    // Requested / opened / refused, per judge — the «по чому відкрилися»
    // half of the comparison the decision completes.
    const judges = d.judges || [];
    const groundCols = judges.filter(j => j.ruling).map(j => {
      const g = j.ruling.grounds || {};
      const col = (key, name) => {
        const v = g[key], list = (v && v.grounds) || [];
        const tags = list.map(x => `<span class="tag">${esc(x)}</span>`).join('');
        return `<div class="stage-col"><div class="stage-name">${name}</div>` +
          (list.length ? `<div class="tags" style="margin-top:0">${tags}</div>` : '<div class="stage-val empty">—</div>') +
          (v && v.note ? `<div class="stage-note">${esc(v.note)}</div>` : '') + `</div>`;
      };
      const who = judges.length > 1 && j.name
        ? `<div class="field-label" style="margin-top:.6rem">${esc(j.name)}</div>` : '';
      return who + `<div class="stages">
        ${col('requested', 'Заявлено у скарзі')}
        ${col('opened', 'Відкрито справу')}
        ${col('rejected', 'Відмовлено у відкритті')}
      </div>`;
    }).join('');

    return `<div class="related related-ruling">
      ${relatedHead('Ухвала про відкриття справи', r, 'ruling')}
      ${facts ? `<div class="stages" style="margin-top:.5rem">${facts}</div>` : ''}
      ${groundCols}
      ${r.facts ? `<div class="field"><div class="field-label">Обставини за ухвалою</div>
        <div class="field-val">${esc(r.facts)}</div></div>` : ''}
    </div>`;
  }

  function reviewBlock(d) {
    const v = d.review;
    if (!v) return '';
    const rows = (d.judges || []).filter(j => j.review).map(j => {
      const r = j.review;
      const who = (d.judges.length > 1 && j.name) ? `<div class="stage-name">${esc(j.name)}</div>` : '';
      const st = r.sanction_type
        ? `<span class="tag sanction">${esc(SANCTION_LABELS[r.sanction_type] || r.sanction_type)}</span>` : '';
      return `<div class="stage-col">${who}
        <div class="stage-val"><strong>${esc(r.review_outcome || '—')}</strong></div>
        <div class="stage-val">${st}${st ? '<br>' : ''}${esc(r.sanction || 'стягнення не залишено')}</div>
      </div>`;
    }).join('');
    return `<div class="related related-review">
      ${relatedHead('Рішення ВРП за результатами перегляду', v, 'review')}
      ${v.appellant_name ? `<div class="stage-note">Скаржник: ${esc(v.appellant_name)}${v.appellant_type ? ` (${esc(v.appellant_type)})` : ''}</div>` : ''}
      ${rows ? `<div class="field"><div class="field-label">Стягнення, що є чинним після перегляду</div>
        <div class="stages">${rows}</div></div>` : ''}
      ${v.essence ? `<div class="field"><div class="field-label">Суть рішення ВРП</div>
        <div class="field-val">${esc(v.essence)}</div></div>` : ''}
    </div>`;
  }

  function cardHtml(d, idx) {
    const concl = (d.summary && d.summary.conclusions) || [];
    const conclHtml = Array.isArray(concl) && concl.length
      ? `<ul>${concl.map(c => `<li>${esc(c)}</li>`).join('')}</ul>`
      : esc((d.summary && d.summary.conclusions) || '');

    const grounds = (d.art106_grounds || []).map(g => `<span class="tag">${esc(g)}</span>`).join('');
    const sk = sanctionKind(d);
    const sanctionTag = sk !== '—' ? `<span class="tag sanction">${esc(sk)}</span>` : '';
    // The chain of acts actually held for this case, so a reader can see at a
    // glance whether the opening act and the review are part of the record.
    const chain = ['ухвала'].filter(() => d.ruling)
      .concat('рішення ДП', hasVrp(d) ? ['рішення ВРП'] : []);
    const stageTag = `<span class="tag stage">${chain.join(' → ')}</span>`;

    const link = d.url
      ? `<a class="src-link" href="${esc(d.url)}" target="_blank" rel="noopener">↗ Джерело: ${esc(d.decision_num || d.filename)}</a>`
      : `<span class="src-link disabled">Джерело недоступне</span>`;

    // Every judge and every court the act names — not just the first. An act
    // that rules on four judges from two courts must not read as one judge from
    // one court: that is the difference between «this case is about Печерський
    // суд» and «this case is also about the ВАКС appeal chamber».
    const names = judgesOf(d);
    const courts = courtsOf(d);
    const titleText = names.length ? names.join(', ') : (d.short_name || d.filename);
    const countChip = names.length > 1
      ? `<span class="judge-count">${names.length} ${pluralJudges(names.length)}</span>` : '';

    const metaParts = [
      d.date,
      chamberLabel(d),
      d.decision_num ? '№ ' + d.decision_num : '',
      courts.join(' · '),
    ].filter(Boolean).map(esc).join(' · ');

    // A ВРП review is a separate act, not a stage of this one, so there is no
    // third column to fill here.
    const qStages = [['complaint','Скарга'],['dp','Дисциплінарна палата']];
    const judges = (d.judges && d.judges.length) ? d.judges : [leadJudge(d)];

    return `<div class="card" data-idx="${idx}">
      <div class="card-head" onclick="toggle(${idx})">
        <div>
          <div class="card-title">${esc(titleText)}${countChip}</div>
          ${d.short_name ? `<div class="card-subtitle">${esc(d.short_name)}</div>` : ''}
          <div class="card-meta">${metaParts}</div>
          <div class="card-essence">${esc((d.summary && d.summary.essence) || '')}</div>
          <div class="tags">${stageTag}${sanctionTag}${grounds}</div>
        </div>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="card-body">
        ${rulingBlock(d)}
        <div class="field">
          <div class="field-label">Фабула</div>
          <div class="field-val">${esc((d.summary && d.summary.facts) || '')}</div>
        </div>
        <div class="field">
          <div class="field-label">Суть рішення</div>
          <div class="field-val">${esc((d.summary && d.summary.essence) || '')}</div>
        </div>
        <div class="field">
          <div class="field-label">Ключові висновки</div>
          <div class="field-val">${conclHtml}</div>
        </div>
        ${qualBlock('Кваліфікація діяння за ст. 106', d.qualification, qStages)}
        ${stageBlock('Поведінка судді - резюме', d.conduct, qStages)}
        ${sanctionBlock(judges)}
        ${reviewBlock(d)}
        ${link}
      </div>
    </div>`;
  }

  window.toggle = function(idx) {
    const card = document.querySelector(`.card[data-idx="${idx}"]`);
    if (card) card.classList.toggle('open');
  };

  function render(list) {
    const box = $('results');
    if (!list.length) { box.innerHTML = '<div class="empty">Рішень не знайдено</div>'; return; }
    box.innerHTML = list.map((d) => cardHtml(d, ALL.indexOf(d))).join('');
  }

  function applyFilters() {
    const q = $('searchInput').value.toLowerCase().trim();
    const j = $('filterJudge').value;
    const c = $('filterCourt').value;
    const g = $('filterGround').value;
    const s = $('filterSanction').value;
    const ch = $('filterChamber').value;

    const filtered = ALL.filter(d => {
      if (j && !judgesOf(d).some(x => x && x.trim() === j)) return false;
      if (c && !courtsOf(d).some(x => x && x.trim() === c)) return false;
      if (g && !(d.art106_grounds || []).some(x => x && x.trim() === g)) return false;
      if (s && sanctionKind(d) !== s) return false;
      if (ch && (d.chamber || '').trim() !== ch) return false;
      if (q) {
        const blob = JSON.stringify(d).toLowerCase();
        if (!blob.includes(q)) return false;
      }
      return true;
    });
    render(filtered);
    $('countBadge').textContent = filtered.length === ALL.length
      ? `${ALL.length} рішень` : `Показано ${filtered.length} з ${ALL.length}`;
  }

  ['searchInput','filterJudge','filterCourt','filterGround','filterSanction','filterChamber']
    .forEach(id => $(id).addEventListener('input', applyFilters));
  // Collapsible filters panel (mobile). Button is hidden on desktop via CSS.
  $('filtersToggle').addEventListener('click', () => {
    const open = document.querySelector('.filters').classList.toggle('open');
    $('filtersToggle').setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  $('resetBtn').addEventListener('click', () => {
    $('searchInput').value = '';
    ['filterJudge','filterCourt','filterGround','filterSanction','filterChamber'].forEach(id => $(id).value = '');
    applyFilters();
  });

  fetch('decisions.json')
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(data => {
      ALL = data;
      buildFacets();
      render(ALL);
      $('countBadge').textContent = `${ALL.length} рішень`;
    })
    .catch(err => {
      $('results').innerHTML =
        `<div class="empty" style="color:#c0392b">Помилка завантаження даних: ${esc(err.message)}<br>
         <small>Переконайтесь, що файл decisions.json знаходиться поруч із index.html.</small></div>`;
    });
</script>

</body>
</html>
